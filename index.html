<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Cek Sertifikat</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100vh;
      border: none;
    }
  </style>
</head>
<body>
  <iframe id="childFrame"></iframe>

  <script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbxRmZ5163dQfhcYsuc1T6qX-HeMZqKMor-bL9FtT3tMyMkdxi9pDbcf2idy2yn7sRdu/exec";

    fetch(GAS_URL)
      .then(response => response.json())
      .then(data => {
        if (data && data.url) {
          const iframe = document.getElementById('childFrame');
          if (iframe) {
            iframe.src = data.url;
          } else {
            window.location.href = data.url;
          }
        }
      })
      .catch(error => console.error("Gagal memuat URL:", error));
  </script>

</body>
</html>
