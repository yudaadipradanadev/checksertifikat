<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifikasi & Cek Sertifikat</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #555;
    }
  </style>
</head>
<body>
  <div id="loader" class="loading">
    <p>Memuat halaman Cek Sertifikat...</p>
  </div>

  <iframe id="appFrame" style="display:none;"></iframe>

  <script>
    // URL Router Google Apps Script Utama (Load Balancer)
    const routerUrl = "https://script.google.com/macros/s/AKfycbxRmZ5163dQfhcYsuc1T6qX-HeMZqKMor-bL9FtT3tMyMkdxi9pDbcf2idy2yn7sRdu/exec";

    const iframe = document.getElementById('appFrame');
    const loader = document.getElementById('loader');

    // Tampilkan iframe langsung ke URL target
    iframe.src = routerUrl;
    
    iframe.onload = function() {
      loader.style.display = 'none';
      iframe.style.display = 'block';
    };

    // Registrasi Service Worker untuk PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker Cek Sertifikat terdaftar'))
          .catch(err => console.error('Gagal mendaftarkan Service Worker', err));
      });
    }
  </script>
</body>
</html>
