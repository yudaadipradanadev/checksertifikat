<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cek Sertifikat</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      font-family: sans-serif;
    }

    #loader-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
      z-index: 9999;
    }

    .spinner {
      width: 45px;
      height: 45px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #007bff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      display: block;
    }
  </style>
</head>
<body>

  <div id="loader-container">
    <div class="spinner"></div>
  </div>

  <script>
    const fallbackURLs = [
      "https://script.google.com/macros/s/AKfycbwB3QwbBXXQk-L3_rZmfTx4xyrwLlrTbDqmM5RPecShxpk1JOt5VI-UpdNfnz9FN_QF/exec",
      "https://script.google.com/macros/s/AKfycbzxruqB4jXjwZlHF-gH989DgEfmwoBJD7GCbyJlHPiCOCTT1CvCLO51HR55SbI9Lr2i/exec",
      "https://script.google.com/macros/s/AKfycbyqURVj5DUu3HPhJZwXAmHrD7DfEgWnicg4QEY7X4r3WU4EuMVPZ5CpxV66CTlpGy-t/exec"
    ];

    function loadIframe(url) {
      const iframe = document.createElement('iframe');
      iframe.src = url;
      iframe.allow = "geolocation; microphone; camera";

      iframe.onload = function() {
        const loader = document.getElementById('loader-container');
        if (loader) loader.style.display = 'none';
      };

      document.body.appendChild(iframe);
    }

    fetch('/api/redirect')
      .then(res => {
        if (!res.ok) throw new Error("Bukan lingkungan Vercel API");
        return res.json();
      })
      .then(data => {
        if (data && data.url) {
          loadIframe(data.url);
        } else {
          throw new Error("URL tidak ditemukan");
        }
      })
      .catch(err => {
        console.warn("Menggunakan fallback rotasi lokal:", err.message);
        const randomIndex = Math.floor(Math.random() * fallbackURLs.length);
        loadIframe(fallbackURLs[randomIndex]);
      });
  </script>

</body>
</html>
