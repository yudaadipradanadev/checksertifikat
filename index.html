<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cek Sertifikat</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      font-family: sans-serif;
    }

    #loader-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
      z-index: 9999;
    }

    .spinner {
      width: 45px;
      height: 45px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #007bff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Loading Spinner Overlay -->
  <div id="loader-container">
    <div class="spinner"></div>
  </div>

  <script>
    const webAppURLs = [
      "https://script.google.com/macros/s/AKfycbwB3QwbBXXQk-L3_rZmfTx4xyrwLlrTbDqmM5RPecShxpk1JOt5VI-UpdNfnz9FN_QF/exec",
      "https://script.google.com/macros/s/AKfycbzxruqB4jXjwZlHF-gH989DgEfmwoBJD7GCbyJlHPiCOCTT1CvCLO51HR55SbI9Lr2i/exec",
      "https://script.google.com/macros/s/AKfycbyqURVj5DUu3HPhJZwXAmHrD7DfEgWnicg4QEY7X4r3WU4EuMVPZ5CpxV66CTlpGy-t/exec"
    ];

    try {

      const randomIndex = Math.floor(Math.random() * webAppURLs.length);
      const targetURL = webAppURLs[randomIndex];


      const iframe = document.createElement('iframe');
      iframe.src = targetURL;
      iframe.allow = "geolocation; microphone; camera";


      iframe.onload = function() {
        const loader = document.getElementById('loader-container');
        if (loader) loader.style.display = 'none';
      };

      document.body.appendChild(iframe);
    } catch (err) {
      console.error("Error:", err);
      document.getElementById('loader-container').innerHTML = 
        '<p style="color: red; font-weight: bold; text-align: center;">Gagal memuat sertifikat. Silakan muat ulang halaman.</p>';
    }
  </script>

</body>
</html>
