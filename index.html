<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cek Sertifikat</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
      color: #666;
    }
  </style>
</head>
<body>
  <div id="loader" class="loading">
    <p>Memuat halaman Cek Sertifikat...</p>
  </div>
  <iframe id="childFrame" style="display:none;"></iframe>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbxRmZ5163dQfhcYsuc1T6qX-HeMZqKMor-bL9FtT3tMyMkdxi9pDbcf2idy2yn7sRdu/exec";
  fetch(GAS_URL)
    .then(response => response.json())
    .then(data => {
      if (data.url) {
        var iframe = document.getElementById('childFrame');
        var loader = document.getElementById('loader');

        if (iframe) {

          iframe.src = data.url;
          iframe.onload = function() {
            if (loader) loader.style.display = 'none';
            iframe.style.display = 'block';
          };
        } else {

          window.location.href = data.url;
        }
      }
    })
    .catch(error => console.error("Error fetching URL:", error));
</script>
</body>
</html>
