<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cek Sertifikat</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
      color: #666;
    }
  </style>
</head>
<body>
  <div id="loader" class="loading">
    <p>Memuat halaman Cek Sertifikat...</p>
  </div>

  <iframe id="childFrame" style="display:none;"></iframe>

  <script>
    google.script.run
      .withSuccessHandler(function(targetUrl) {
        var iframe = document.getElementById('childFrame');
        var loader = document.getElementById('loader');
        
        // Memuat URL child di dalam iframe agar banner tersembunyi
        iframe.src = targetUrl;
        iframe.onload = function() {
          loader.style.display = 'none';
          iframe.style.display = 'block';
        };
      })
      .routeToWebAppWithUA();
  </script>
</body>
</html>
